<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Totally Normal Study Site</title>
    <style>
        /* [Keeping all your existing CSS here] */
        body { background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        .emoji-background { position: absolute; width: 100%; height: 100%; opacity: 0.15; z-index: 1; pointer-events: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
        
        .landing-container { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
        
        /* New Search Bar Styles */
        .search-box { margin-top: 20px; }
        .search-box input { padding: 12px; width: 300px; border-radius: 20px; border: 1px solid #444; background: #1a1a1a; color: white; text-align: center; }
        .search-box button { padding: 10px 20px; border-radius: 20px; border: none; background: #00ffcc; cursor: pointer; font-weight: bold; }
        
        .controller-btn { position: fixed; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 50%; padding: 12px; cursor: pointer; z-index: 10; border: none; font-size: 1.5rem; }
        
        .games-hub { display: none; padding: 40px; position: relative; z-index: 2; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: #1a1a1a; padding: 30px; border-radius: 12px; text-align: center; }
        .modal input { padding: 10px; border-radius: 6px; background: #111; color: white; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="emoji-background" id="emojiBg"></div>

    <!-- Landing Page with Search Bar -->
    <div class="landing-container" id="landingView">
        <h1>StudyNotes Hub</h1>
        <p>Your academic research portal.</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for study topics...">
            <button onclick="performSearch()">Search</button>
        </div>
    </div>

    <!-- Hidden Games Hub -->
    <div class="games-hub" id="gamesView">
        <h2>🎮 Unblocked Vault</h2>
        <!-- Game cards here -->
    </div>

    <button class="controller-btn" onclick="openModal()">🎮</button>

    <div class="modal-overlay" id="codeModal">
        <div class="modal">
            <h3>Enter Access Code</h3>
            <input type="password" id="codeInput" maxlength="4">
            <button onclick="checkCode()">Submit</button>
        </div>
    </div>

    <script>
        // Nut Background
        const bg = document.getElementById('emojiBg');
        for (let i = 0; i < 300; i++) {
            const span = document.createElement('span'); span.textContent = '🥜'; bg.appendChild(span);
        }

        // Search Functionality
        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (query) {
                window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
            }
        }

        // Modal Logic
        function openModal() { document.getElementById('codeModal').style.display = 'flex'; }
        
        function checkCode() {
            if (document.getElementById('codeInput').value === '888') {
                document.getElementById('landingView').style.display = 'none';
                document.getElementById('gamesView').style.display = 'block';
                document.getElementById('codeModal').style.display = 'none';
            } else {
                alert('Wrong code!');
            }
        }
    </script>
</body>
</html>
